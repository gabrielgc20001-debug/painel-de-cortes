<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Cortes – Connecting</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:620px;margin:80px auto;padding:0 16px;text-align:center;color:#1f2937;background:#fff}
h1{color:#3b0f8c;font-size:24px}
a{color:#e11d48}
</style>
</head>
<body>
<h1>Painel de Cortes</h1>
<p id="msg">Connecting your TikTok account…</p>
<script>
(async () => {
  const p = new URLSearchParams(location.search);
  const msg = document.getElementById('msg');
  if (p.get('error')) { msg.innerHTML = 'Authorization was not completed (' + (p.get('error_description') || p.get('error')) + '). <a href="./">Back</a>'; return; }
  try {
    const r = await fetch('http://localhost:8787/api/exchange', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({code: p.get('code'), state: p.get('state')})
    });
    const j = await r.json();
    if (!r.ok) throw new Error(typeof j.error === 'string' ? j.error : JSON.stringify(j.error));
    history.replaceState(null, '', location.pathname);
    msg.textContent = 'TikTok connected! Opening the panel…';
    setTimeout(() => location.href = './', 800);
  } catch (e) {
    msg.innerHTML = 'Could not finish connecting: ' + e.message + '<br><a href="./">Back</a>';
  }
})();
</script>
</body>
</html>
